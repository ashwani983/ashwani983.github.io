name: Update blog index

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate blog index
        run: node scripts/generate-blog-index.js

      - name: Commit generated index
        run: |
          if [ -n "$(git status --porcelain data/blog-posts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/blog-posts.json
            git commit -m "chore: regenerate blog index from posts"
            git push origin main
          else
            echo "No changes to blog-posts.json"
          fi
