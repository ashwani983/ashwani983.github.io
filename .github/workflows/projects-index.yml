name: Update projects index

on:
  push:
    branches:
      - main
    paths:
      - 'projects/**'

concurrency:
  group: projects-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate projects index
        run: node scripts/generate-projects-index.js

      - name: Commit generated index
        run: |
          if [ -n "$(git status --porcelain data/projects.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/projects.json
            git commit -m "chore: regenerate projects index from projects"
            git push origin main
          else
            echo "No changes to projects.json"
          fi
